---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mqtt-broker
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: eclipse-mosquitto
              tag: "2.1.2-alpine"
            env:
              TZ: "America/Chicago"
      web:
        containers:
          main:
            image:
              repository: terdia07/mqttui
              tag: "v2.0"
            env:
              TZ: "America/Chicago"
              MQTTUI_ADMIN_USER: admin
              MQTT_BROKER: mqtt.sparks.codes
            envFrom:
              - secretRef:
                  name: mqttui-secrets
    persistence:
      config:
        enabled: true
        type: configMap
        name: mosquitto
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
      data:
        enabled: true
        existingClaim: local-bunkerm-pvc
        globalMounts:
          - path: /mosquitto/config
            subPath: config
          - path: /mosquitto/data
            subPath: data
          - path: /mosquitto/log
            subPath: logs
      pwfile:
        enabled: true
        type: secret
        name: mosquitto-secrets
        globalMounts:
          - path: /mosquitto/config/pwfile
            subPath: users
    service:
      main:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 10.10.201.3
        controller: main
        ports:
          http:
            port: 9001
          mqtt:
            enabled: true
            port: 1883
      web:
        controller: web
        ports:
          http:
            port: 5000
    ingress:
      web:
        enabled: true
        className: "traefik"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "MQTT Broker"
          hajimari.io/info: MQTT Dashboard
          hajimari.io/icon: "home-automation"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host mqtt-dashboard.sparks.codes
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: acme-crt-secret-sparks-codes
            hosts:
              - *host

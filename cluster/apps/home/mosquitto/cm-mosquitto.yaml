apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto
  namespace: home
data:
  mosquitto.conf: |
    # Mosquitto configuration file
    # https://mosquitto.org/documentation/configuration/
    # Network Listeners
    listener 1883
    listener 9001
    protocol websockets

    # Persistence & Logging
    persistence true
    persistence_location /mosquitto/data/
    log_dest file /mosquitto/log/mosquitto.log
    log_dest stdout

    # Authentication (Set allow_anonymous to true only for local testing)
    allow_anonymous false
    password_file /mosquitto/config/pwfile

apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant
  namespace: home
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-repository
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    - pvc:
        name: home-assistant-pvc
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  deletion:
    onScheduleDelete: Delete
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: home-assistant-daily
  namespace: home
spec:
  policyRef:
    name: home-assistant
  schedule:
    cron: "0 */3 * * *"
    jitter: 30m
    runOnCreate: true
  deletion:
    onScheduleDelete: Delete

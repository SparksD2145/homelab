---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mqtt-broker
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: bunkeriot/bunkerm
              tag: "v2.1.0"
            env:
              TZ: "America/Chicago"
              HOST_ADDRESS: &host mqtt.sparks.codes
    persistence:
      config:
        enabled: true
        existingClaim: local-bunkerm-pvc
        globalMounts:
          - path: /etc/mosquitto
            subPath: config
          - path: /var/lib/mosquitto
            subPath: data
          - path: /data
            subPath: auth
    service:
      main:
        type: LoadBalancer
        annotations:
          metallb.io/loadBalancerIPs: 10.10.201.3
        controller: main
        ports:
          http:
            port: 2000
          mqtt:
            enabled: true
            port: 1883
    ingress:
      main:
        enabled: true
        className: "traefik"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "MQTT Broker"
          hajimari.io/info: MQTT Dashboard
          hajimari.io/icon: "home-automation"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: *host
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: acme-crt-secret-sparks-codes
            hosts:
              - *host

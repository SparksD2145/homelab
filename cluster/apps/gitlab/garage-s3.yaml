---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-rustfs
  namespace: gitlab
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: dxflrs/garage
              tag: "v2.3.0"
            env:
              TZ: "America/Chicago"
              RUSTFS_CONSOLE_ENABLE: false
              RUSTFS_SERVER_DOMAINS: iwrite.software
              GARAGE_DEFAULT_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gitlab-secrets
                    key: GARAGE_DEFAULT_ACCESS_KEY
              GARAGE_DEFAULT_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gitlab-secrets
                    key: GARAGE_DEFAULT_SECRET_KEY
    service:
      main:
        controller: main
        ports:
          http:
            port: 9000
    persistence:
      data:
        enabled: true
        globalMounts:
          - path: /data
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: ceph-filesystem
        size: 60Gi

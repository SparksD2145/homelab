---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-rustfs
  namespace: gitlab
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: rustfs/rustfs
              tag: "latest"
            env:
              TZ: "America/Chicago"
              RUSTFS_CONSOLE_ENABLE: false
              RUSTFS_SERVER_DOMAINS: iwrite.software
              RUSTFS_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gitlab-secrets
                    key: RUSTFS_ACCESS_KEY
              RUSTFS_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gitlab-secrets
                    key: RUSTFS_SECRET_KEY
    service:
      main:
        controller: main
        ports:
          http:
            port: 9000
    persistence:
      data:
        enabled: true
        globalMounts:
          - path: /data
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: ceph-filesystem
        size: 60Gi

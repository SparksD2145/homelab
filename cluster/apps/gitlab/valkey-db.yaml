---
apiVersion: hyperspike.io/v1
kind: Valkey
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  anonymousAuth: false
  clusterDomain: cluster.local
  prometheus: false
  serviceMonitor: false
  nodes: 1

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 150m
      memory: 1Gi

  storage:
    apiVersion: v1
    kind: PersistentVolumeClaim
    spec:
      storageClassName: ceph-block
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

  volumePermissions: true

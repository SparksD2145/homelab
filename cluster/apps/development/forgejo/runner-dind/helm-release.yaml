---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: development
spec:
  interval: 15m
  # dependsOn:
  #   - name: forgejo
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    # yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    controllers:
      main:
        initContainers:
          setup-runner:
            image:
              repository: codeberg.org/forgejo/forgejo
              tag: 17.0.2-rootless
            env:
              TZ: "America/Chicago"
              USER_UID: 1000
              USER_GID: 1000
            command:
              - bash
            args:
              - -c
              - >-
                cp /var/lib/actions/config.tmpl.yaml /var/lib/actions/config.yaml ;
                sed -i "s/<RUNNER_TOKEN>/$(cat /var/lib/actions/secrets/token)/" /var/lib/actions/config.yaml ;
                sed -i "s/<RUNNER_UUID>/$(cat /var/lib/actions/secrets/uuid)/" /var/lib/actions/config.yaml ;

        containers:
          docker-in-docker:
            securityContext:
              runAsNonRoot: false
              privileged: true
              runAsUser: 0
              runAsGroup: 0
            image:
              repository: docker
              tag: dind
            command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
            env: []
              # DOCKER_TLS_CERTDIR: /certs

          runner-daemon:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.2
            env:
              DOCKER_HOST: tcp://0.0.0.0:2375
              # DOCKER_CERT_PATH: /certs/client
              # DOCKER_TLS_VERIFY: "1"
            command:
              - bash
            args:
              - -c
              - >-
                sleep 25;
                forgejo-runner daemon --config /var/lib/actions/config.yaml ;

    service:
      runner:
        controller: main
        ports:
          http:
            port: 3000
          ssh:
            port: 22
    persistence:
      runner-data:
        enabled: true
        globalMounts:
          - path: /data
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: ceph-filesystem
        size: 2Gi

      runner-secret:
        enabled: true
        globalMounts:
          - path: /var/lib/actions/secrets/token
            subPath: actions-token
          - path: /var/lib/actions/secrets/uuid
            subPath: actions-uuid
        type: secret
        name: forgejo-secrets

      runner-config-template:
        enabled: true
        type: configMap
        name: forgejo-runner-config-template
        globalMounts:
          - path: /var/lib/actions/config.tmpl.yaml
            subPath: config.tmpl.yaml

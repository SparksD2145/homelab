---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vhs-capture
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      runtimeClassName: nvidia
      tolerations:
        - key: machine-vhs
          operator: Exists
          effect: NoSchedule
    controllers:
      main:
        containers:
          main:
            image:
              repository: bandi13/docker-obs
              tag: "latest"
            env:
              TZ: "America/Chicago"
            securityContext:
              privileged: true
            resources:
              requests:
                nvidia.com/gpu: 1
              limits:
                nvidia.com/gpu: 1
    service:
      main:
        controller: main
        ports:
          http:
            port: 5901
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "VHS Capture"
          hajimari.io/info: "Web OBS Studio for VHS capture"
          hajimari.io/icon: "vhs"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host vhs.sparks.codes
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: acme-crt-secret-sparks-codes
    persistence:
      config:
        enabled: true
        globalMounts:
          - path: /root/.config/obs-studio
            subPath: config
        existingClaim: local-vhs-media-pvc
      media:
        enabled: true
        globalMounts:
          - path: /media
            subPath: media
        existingClaim: local-vhs-media-pvc
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      dev-video0:
        enabled: true
        type: hostPath
        hostPath: /dev/video0
      dev-video1:
        enabled: true
        type: hostPath
        hostPath: /dev/video1

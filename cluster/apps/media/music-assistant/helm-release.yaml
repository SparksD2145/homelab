---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      hostNetwork: true
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/music-assistant/server:latest
              tag: "2.10.11"
            env:
              TZ: "America/Chicago"
    service:
      main:
        controller: main
        ports:
          http:
            port: 8095
          streaming:
            enabled: true
            port: 8097
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "Music Assistant"
          hajimari.io/info: "Music streaming helper"
          hajimari.io/icon: "music-circle"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host music.sparks.codes
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: acme-crt-secret-sparks-codes
    persistence:
      data:
        enabled: true
        globalMounts:
          - path: /data
        size: 5Gi
        accessMode: "ReadWriteMany"
        storageClass: ceph-filesystem

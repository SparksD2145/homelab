---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: deluan/navidrome
              tag: "latest"
            env:
              TZ: "America/Chicago"
    ingress:
      main:
        enabled: true
        className: "cloudflare-tunnel"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "Navidrome"
          hajimari.io/info: "Music library"
          hajimari.io/icon: "play-network"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host navidrome.sparks.codes
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: acme-crt-secret-sparks-codes
      internal:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: "false"
        hosts:
          - host: *host
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: acme-crt-secret-sparks-codes
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: local-navidrome-pvc
        globalMounts:
          - path: /data
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: local-jellyfin-media
        advancedMounts:
          main:
            main:
              - path: /music
                readOnly: true
                subPath: Music
    service:
      main:
        controller: main
        ports:
          http:
            port: 4533

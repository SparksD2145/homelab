---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web-nextgen
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/new-usemame/calibre-web-nextgen
              tag: v4.1.70
            env:
              TZ: America/Chicago
              PUID: "0"
              PGID: "0"
              CWA_PORT_OVERRIDE: "8083"
              TRUSTED_PROXY_COUNT: "1"
              CWA_CALIBRE_LIBRARY_DIR: /books
              # CWA_INGEST_FOLDER=/cwa-book-ingest
            envFrom:
              - secretRef:
                  name: calibre-web-nextgen-secrets
            # resources:
            #   requests:
            #     cpu: 10m
            #     memory: 128Mi
            #   limits:
            #     cpu: 50m
            #     memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8083
    ingress:
      main:
        enabled: true
        className: "traefik"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "Books"
          hajimari.io/info: "Book storage and E-reader"
          hajimari.io/icon: "book"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: "books.sparks.codes"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - "books.sparks.codes"
            secretName: acme-crt-secret-sparks-codes
    persistence:
      config:
        enabled: true
        globalMounts:
          - path: /config
        existingClaim: local-calibre-config
      books:
        enabled: true
        globalMounts:
          - path: /books
        existingClaim: local-calibre-books

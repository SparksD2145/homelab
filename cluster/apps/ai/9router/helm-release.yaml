---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-router
  namespace: ai
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: decolua/9router
              tag: "0.5.40"
            env:
              TZ: "America/Chicago"
              DATA_DIR: /app/data
              PORT: "20128"
              HOSTNAME: "0.0.0.0"
              NODE_ENV: production
              HEADROOM_URL: http://ai-router-headroom.ai.svc.cluster.local:8787
      headroom:
        containers:
          main:
            image:
              repository: ghcr.io/chopratejas/headroom
              tag: latest
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: ceph-filesystem
        size: 20Gi
        globalMounts:
          - path: /app/data
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 20128
      headroom:
        controller: headroom
        type: ClusterIP
        ports:
          http:
            port: 8787
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: cloud-search
          hajimari.io/info: "AI Routing Manager"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host "ai.sparks.codes"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: acme-crt-secret-sparks-codes
            hosts:
              - *host

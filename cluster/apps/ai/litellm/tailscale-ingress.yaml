---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tailscale-litellm
  namespace: ai
  annotations:
    tailscale.com/proxy-group: litellm-proxy
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - ai-services
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000

---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: litellm-proxy
  namespace: ai
spec:
  type: ingress
  replicas: 1

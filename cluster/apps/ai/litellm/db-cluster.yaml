---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-postgresql
  namespace: ai
spec:
  instances: 2
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: litellm
      owner: app
      secret:
        name: litellm-db-secret

  storage:
    size: 15Gi
    storageClass: ceph-block

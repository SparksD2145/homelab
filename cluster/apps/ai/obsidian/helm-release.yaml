---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian
  namespace: ai
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/obsidian
              tag: 1.13.7
            env:
              TZ: "America/Chicago"
              PUID: 10000
              PGID: 10000
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: hermes-agent
        advancedMounts:
          main:
            main:
              - path: /config
                subPath: obsidian
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: cloud-search
          hajimari.io/info: "Obsidian"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host "obsidian.sparks.codes"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: acme-crt-secret-sparks-codes
            hosts:
              - *host

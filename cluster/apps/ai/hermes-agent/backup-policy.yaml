---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: hermes-agent
  namespace: ai
spec:
  repositories:
    - kind: ClusterRepository
      name: kopiur-repository
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    - pvc:
        name: hermes-agent
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: hermes-agent-daily
  namespace: ai
spec:
  # Which recipe (SnapshotPolicy) to invoke each firing.
  policyRef:
    name: hermes-agent
  schedule:
    cron: "0 8 * * *"
    jitter: 30m
    # GitOps-friendly default: do not fire immediately on create.
    runOnCreate: false

apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: hermes-agent
  namespace: ai
spec:
  repository:
    kind: ClusterRepository
    name: kopiur-repository
  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    - pvc:
        name: hermes-agent
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  deletion:
    onPolicyDelete: Delete
    onScheduleDelete: Delete
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: hermes-agent-daily
  namespace: ai
spec:
  policyRef:
    name: hermes-agent
  schedule:
    cron: "0 */3 * * *"
    jitter: 30m
    runOnCreate: true

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
  namespace: tools
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: docker.io/searxng/searxng
              tag: 2026.7.25-0909dbc9e
            env:
              TZ: "America/Chicago"
              SEARXNG_PORT: 8080
              SEARXNG_SETTINGS_PATH: /etc/searxng/settings.override.yaml
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: true
        className: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "Web Search"
          hajimari.io/info: "Web search engine"
          hajimari.io/icon: "search"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host search.sparks.codes
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: acme-crt-secret-sparks-codes
    persistence:
      config:
        enabled: true
        type: secret
        name: searxng-config
        globalMounts:
          - path: /etc/searxng/settings.override.yaml
            readOnly: false
            subPath: config.yaml
      data:
        enabled: true
        globalMounts:
          - path: /var/cache/searxng
        storageClass: ceph-filesystem
        accessMode: ReadWriteMany
        size: 30Gi
        retain: true

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orca-slicer
  namespace: tools
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      hostNetwork: true
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/orcaslicer
              tag: 2.4.2
            env:
              TZ: "America/Chicago"
              PUID: 10000
              PGID: 10000
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    ingress:
      main:
        enabled: true
        className: "traefik"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "OrcaSlicer"
          hajimari.io/info: "3D Print Slicer for GCode"
          hajimari.io/icon: "printer-3d"
          hajimari.io/targetBlank: "true"
        hosts:
          - host: &host orcaslicer.sparks.codes
            paths:
              - path: "/"
                pathType: "Prefix"
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: acme-crt-secret-sparks-codes
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: ceph-filesystem
        size: 15Gi
        retain: true
        globalMounts:
          - path: /config

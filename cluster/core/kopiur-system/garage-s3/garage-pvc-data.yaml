---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-kopiur-data-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Ti
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/local/backups.sparks.codes/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - omega

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-kopiur-data-pvc
  namespace: kopiur-system
spec:
  volumeName: local-kopiur-data-pv
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Ti

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-csi
  namespace: rook-ceph
spec:
  interval: 15m
  dependsOn:
    - name: rook-ceph-operator
  chart:
    spec:
      # renovate: registryUrl=https://charts.rook.io/release
      chart: rook-ceph
      version: v1.20.0
      sourceRef:
        kind: HelmRepository
        name: rook-charts
        namespace: flux-system
      interval: 15m
  values:
    operatorConfig:
      driverSpecDefaults:
        deployCsiAddons: true
    drivers:
      nfs:
        enabled: true
        name: rook-ceph.nfs.csi.ceph.com

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kopiur-source
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/home-operations/kopiur.git
  ref:
    tag: 0.10.4
  ignore: |
    # exclude all
    /*
    # path to crds
    !/deploy/crds/all-crds.yaml

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-crds
  namespace: flux-system
spec:
  interval: 15m
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: kopiur-source
